a{color:var(--teal)}header{background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:12px 24px}

header a{color:#dbe7ea;text-decoration:none;padding:4px 2px;border-bottom:2px solid transparent}header a:hover,header a:focus-visible{border-color:var(--amb)}

label{display:block;font-weight:600;margin:12px 0 4px}input,select,textarea{width:100%;padding:9px;border:1px solid #9fb0b6;border-radius:4px;font:inherit;background:#fff}
form.f{max-width:520px;background:var(--w);border:1px solid var(--ln);padding:20px;border-radius:6px}form.f .btn{margin-top:16px}
table{width:100%;border-collapse:collapse;background:var(--w);font-size:.92rem}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);vertical-align:top}th{background:#E3EEF0}.tw{overflow-x:auto}

footer{background:var(--ink);color:#b8c8cd;padding:20px 24px;font-size:.85rem}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
@media print{header,footer,.np{display:none!important}body{background:#fff}}

function home(){return`<div class="hero"><div><h1>Capacitar bem é o jeito mais barato de manter a equipe.</h1><p>Plataforma de treinamento corporativo feita só para micro e pequenas empresas: cadastre sua empresa, atribua cursos por cargo, acompanhe cada colaborador e emita certificados digitais.</p><p><a class="btn a" href="#cadastro">Cadastrar minha empresa</a> <a class="btn g" href="#cursos">Ver cursos</a> <a class="btn g" href="#sobre">Quem somos</a> <button class="btn g" onclick="demo()">Entrar na conta demo</button></p></div>
<div class="tb"><div class="w"><small>Caso estudado</small>AOL Engenharia, São Bernardo do Campo, fundada em 2005</div><div><small>Estagiários em 2026</small><strong>6</strong></div><div><small>Processos parados</small><strong>+10 anos</strong></div><div class="w"><small>Problema priorizado</small>Retenção de funcionários: cada saída exige novo treinamento e supervisão do proprietário</div></div></div>
<section><h2>Como funciona</h2><div class="grid"><div class="card"><h3>1. Cadastro da empresa</h3>CNPJ validado e porte verificado: só MEI, ME e EPP.</div><div class="card"><h3>2. Funcionários e trilhas</h3>Cadastre a equipe e atribua cursos por cargo ou departamento.</div><div class="card"><h3>3. Módulos e quiz</h3>Cada módulo termina em um questionário. Mínimo para aprovar: ${MIN}%.</div><div class="card"><h3>4. Certificado</h3>Emitido automaticamente, com nome, curso, data, carga horária e assinatura do proprietário.</div></div></section>
<section><h2>Cinco critérios de tecnologia social</h2><div class="grid">${[['Simplicidade','Interface direta: cadastro, atribuição, módulos e certificado em poucos cliques.'],['Baixo custo','Biblioteca compartilhada e assinatura mensal acessível dividem o custo entre empresas.'],['Fácil aplicabilidade','Sem mudar a estrutura da empresa; o colaborador estuda quando puder, sem encontros presenciais.'],['Replicabilidade','Cursos por área e função adaptam a mesma base a qualquer segmento de pequena empresa.'],['Impacto social','Amplia o acesso à capacitação e valoriza o trabalhador, alinhado ao ODS 8.']].map(x=>`<div class="card k"><h3>${x[0]}</h3>${x[1]}</div>`).join('')}</div></section>
<section><h2>ODS 8 – Trabalho decente e crescimento econômico</h2><p>Formação contínua, reconhecimento por certificados e acompanhamento individual favorecem vínculos duradouros. No Brasil, cerca de 52% dos adolescentes trabalhadores ficam menos de um ano na mesma ocupação, e o Novo CAGED registrou 26,6 milhões de admissões e 25,3 milhões de desligamentos formais em 2025 (dados citados no relatório do projeto).</p></section>
<section><h2>Assinatura mensal</h2><div class="card k" style="max-width:420px"><h3>Plano PME</h3>Todos os cursos, funcionários ilimitados, painel e certificados. <p class="mut">Valor e cobrança ilustrativos: este protótipo não processa pagamentos.</p></div></section>`}
function about(){return`<h1>Sobre a TrilhaPME</h1><p style="max-width:62ch">Somos uma plataforma de capacitação criada para que micro e pequenas empresas treinem suas equipes sem precisar montar uma área de treinamento do zero.</p>
<section><h2>Quem somos</h2><p style="max-width:62ch">A TrilhaPME nasceu no Pitch de Inovação Social do Centro Universitário FEI, projeto da disciplina de Projeto de Inovação Social. Quem criou a plataforma foram quatro estudantes:</p><div class="grid">${['Leonardo Argentino Alves','Rafael Marinho de Souza','Samuel Pereira Luiz','Vítor Marcucci Puertas'].map(n=>`<div class="card k"><h3>${n}</h3><span class="mut">Estudante, Centro Universitário FEI</span></div>`).join('')}</div></section>
<section><h2>De onde surgiu a necessidade</h2><p style="max-width:62ch">Tudo começou com uma entrevista na AOL Engenharia, pequena empresa de São Bernardo do Campo fundada em 2005. Conversamos com o proprietário, Francisco, e mapeamos como o negócio funciona no dia a dia.</p><div class="grid"><div class="card"><h3>1. A conversa</h3>Entrevista semiestruturada, gravada e registrada em ata, sobre gargalos, tarefas e equipe.</div><div class="card"><h3>2. O sintoma</h3>Seis estagiários passaram pela empresa só em 2026. Muitos saem atrás de oportunidades melhores, até por diferenças pequenas de salário.</div><div class="card"><h3>3. O custo</h3>Cada saída exige novo treinamento e supervisão do proprietário, com perda de conhecimento e sobrecarga.</div><div class="card"><h3>4. A escolha</h3>Entre vários problemas, priorizamos a retenção de funcionários e decidimos criar uma tecnologia social para isso.</div></div></section>
<section><h2>Por que fazemos isso</h2><p style="max-width:62ch">A rotatividade da AOL não é um caso isolado. No Brasil, cerca de 52% dos adolescentes trabalhadores ficam menos de um ano na mesma ocupação, e o Novo CAGED registrou 26,6 milhões de admissões e 25,3 milhões de desligamentos formais em 2025. Grandes empresas têm áreas de treinamento; as pequenas, em geral, não têm orçamento nem tempo.</p><p style="max-width:62ch">Acreditamos que oferecer aprendizado contínuo, acompanhamento individual e reconhecimento por certificados ajuda o colaborador a enxergar futuro onde trabalha e alivia o dono do negócio. Por isso, o foco é reduzir a rotatividade ao tornar a capacitação acessível, e alinhamos esse objetivo ao ODS 8 da ONU: trabalho decente e crescimento econômico.</p></section>
<section><h2>O que nos guia</h2><div class="grid"><div class="card k"><h3>Só para pequenas empresas</h3>Atendemos MEI, ME e EPP, que mais sofrem com falta de recursos.</div><div class="card k"><h3>Simples e de baixo custo</h3>Uma biblioteca compartilhada e uma assinatura acessível dividem o custo entre as empresas.</div><div class="card k"><h3>Replicável</h3>Nascemos de um caso de engenharia, mas os cursos cobrem engenharia, administrativo e TI, e cada empresa pode criar os seus.</div></div></section>
<section><h2>Situação atual</h2><p style="max-width:62ch">A TrilhaPME é um protótipo acadêmico. Os dados ficam salvos só no seu navegador e a assinatura é ilustrativa. Queremos evoluir a plataforma com a escuta de empresas e colaboradores, perspectivas que ainda não conseguimos ouvir na pesquisa, feita só com o proprietário.</p><p><a class="btn a" href="#cadastro">Cadastrar minha empresa</a> <a class="btn g" href="#cursos">Ver cursos</a></p></section>`}
function reg(){return`<h1>Cadastro da empresa</h1><form class="f" onsubmit="doReg(event)"><label>Razão social<input name="name" required></label><label>CNPJ<input name="cnpj" required placeholder="00.000.000/0000-00" inputmode="numeric"></label><label>Porte da empresa<select name="porte"><option>MEI</option><option>ME</option><option>EPP</option><option value="MG">Média ou grande</option></select></label><label>Nome do proprietário (assina os certificados)<input name="owner" required></label><label>E-mail de acesso<input type="email" name="email" required></label><label>Senha<input type="password" name="pass" required minlength="4"></label><button class="btn">Criar conta da empresa</button><p class="mut">O CNPJ é validado pelos dígitos verificadores e o porte é declarado. Em produção, a consulta seria feita na Receita Federal.</p></form>`}
function login(){return`<h1>Entrar</h1><form class="f" onsubmit="doLogin(event)"><label>E-mail<input type="email" name="email" required></label><label>Senha<input type="password" name="pass" required></label><button class="btn">Entrar</button> <button type="button" class="btn g" onclick="demo()">Conta demo (admin)</button><p class="mut">Demo: francisco@aol.demo (admin), ana@aol.demo ou bruno@aol.demo (colaboradores). Senha 1234.</p></form>`}
function cat(){const u=me(),f=location.hash.split('/')[1]||'';const l=myC().filter(c=>!f||c.a==f);return`<h1>Cursos disponíveis</h1><div role="group" aria-label="Filtrar por área" style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px">${['',...AREAS].map(x=>`<a class="btn s ${x==f?'':'g'}" href="#cursos${x?'/'+x:''}" ${x==f?'aria-current="true"':''}>${x||'Todos'} (${myC().filter(c=>!x||c.a==x).length})</a>`).join('')}</div><div class="grid">${l.map(c=>`<div class="card"><span class="tag">${E(c.a)}</span> <span class="mut">${c.h} h · ${c.m.length} módulos</span><h3>${E(c.t)}</h3><p>${E(c.d)}</p>${u?(u.assign.includes(c.id)||u.role=='admin'?bar(pct(u.id,c.id))+`<a class="btn s" href="#curso/${c.id}">${pct(u.id,c.id)?'Continuar':'Começar'}</a>`:'<span class="mut">Peça atribuição ao responsável.</span>'):'<a class="btn s g" href="#entrar">Entre para estudar</a>'}</div>`).join('')}</div>`}
function player(i){const u=me(),c=course(i);if(!c)return'<p>Curso não encontrado.</p>';if(u.role!='admin'&&!u.assign.includes(i))return'<p>Este curso não foi atribuído a você.</p>';const p=prog(u.id,i),done=pct(u.id,i)==100;
return`<p><a href="#cursos">← Cursos</a></p><h1>${E(c.t)}</h1><p><span class="tag">${E(c.a)}</span> ${c.h} h · ${pct(u.id,i)}% concluído</p>${bar(pct(u.id,i))}${done?`<p class="ok"><b>Curso concluído.</b> <a class="btn a s" href="#certificado/${i}">Ver certificado</a></p>`:''}
${c.m.map((m,k)=>{const open=k==0||passed(u.id,i,k-1);return`<div class="card" style="margin:14px 0"><h3>Módulo ${k+1}: ${E(m[0])} ${passed(u.id,i,k)?'<span class="ok">✓ aprovado ('+p.sc[k]+'%)</span>':''}</h3>${open?`<p>${E(m[1])}</p><form onsubmit="sub(event,'${i}',${k})">${m[2].map((q,n)=>`<div class="q"><b>${E(q[0])}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${n}" value="${j}" required>${E(o)}</label>`).join('')}</div>`).join('')}<button class="btn s">${passed(u.id,i,k)?'Refazer quiz':'Enviar respostas'}</button>${p.sc[k]!=null&&!passed(u.id,i,k)?` <span class="bad">Melhor nota: ${p.sc[k]}%. Mínimo: ${MIN}%.</span>`:''}</form>`:'<p class="mut">🔒 Aprove o módulo anterior para liberar.</p>'}</div>`}).join('')}`}
function cert(i){const u=me(),c=course(i),p=c&&prog(u.id,i);if(!p||!p.cert)return'<p>Certificado indisponível. Conclua todos os módulos do curso.</p>';const o=co();return`<p class="np"><a href="#perfil">← Perfil</a> <button class="btn s" onclick="print()">Imprimir ou salvar PDF</button></p><div class="cert"><h1>Certificado de conclusão</h1><p>Certificamos que</p><p><span class="n">${E(u.name)}</span></p><p>concluiu o curso <b>${E(c.t)}</b> em ${fmt(p.cert)}, com carga horária total de <b>${c.h} horas</b>, na empresa ${E(o.name)}.</p><span class="sig">${E(o.owner)}</span><br><small>Proprietário(a) – ${E(o.name)}</small><p class="mut">Código de validação: ${(u.id+i+p.cert).replace(/\W/g,'').slice(-12).toUpperCase()}</p></div>`}
function prof(){const u=me(),o=co(),as=u.role=='admin'?myC().map(c=>c.id):u.assign;const certs=as.filter(c=>prog(u.id,c).cert);return`<h1>Meu perfil</h1><div class="grid"><form class="card" onsubmit="saveP(event)"><h3>Dados</h3><label>Nome<input name="name" value="${E(u.name)}" required></label><label>Cargo<input name="cargo" value="${E(u.cargo)}" required></label><label>Nova senha (opcional)<input type="password" name="pass"></label><p class="mut">${E(u.email)} · ${E(o.name)} · ${E(u.depto)} · ${u.role=='admin'?'Administrador':'Colaborador'}</p><button class="btn s">Salvar</button></form>
<div class="card"><h3>Plano de desenvolvimento individual</h3>${u.pdi.map((x,k)=>`<p><label style="font-weight:400;margin:0"><input type="checkbox" style="width:auto" ${x.ok?'checked':''} onchange="tg('${u.id}',${k})"> ${E(x.c)}</label></p>`).join('')||'<p class="mut">Nenhuma competência cadastrada.</p>'}<form onsubmit="addP(event,'${u.id}')"><input name="c" placeholder="Competência a aprimorar" required> <button class="btn s">Adicionar</button></form></div></div>
<section><h2>Meus cursos</h2><div class="grid">${as.map(c=>course(c)).filter(Boolean).map(c=>`<div class="card"><h3>${E(c.t)}</h3>${pct(u.id,c.id)}%${bar(pct(u.id,c.id))}<a class="btn s" href="#curso/${c.id}">Abrir</a></div>`).join('')||'<p>Sem cursos atribuídos.</p>'}</div></section><section><h2>Certificados (${certs.length})</h2>${certs.map(c=>`<p><a href="#certificado/${c}">${E(course(c).t)}</a> – ${fmt(prog(u.id,c).cert)}</p>`).join('')||'<p class="mut">Conclua um curso para receber seu primeiro certificado.</p>'}</section>`}
const team_=()=>S.users.filter(x=>x.co==S.users.find(u=>u.id==S.me).co&&x.role=='func');
function panel(){const L=team_(),cs=myC();let a=0,d=0;const rows=L.map(u=>{const n=u.assign.length,k=u.assign.filter(c=>pct(u.id,c)==100).length,sc=u.assign.flatMap(c=>Object.values(prog(u.id,c).sc)),m=sc.length?Math.round(sc.reduce((x,y)=>x+y)/sc.length)+'%':'–';a+=n;d+=k;return`<tr><td>${E(u.name)}<br><span class="mut">${E(u.cargo)}</span></td><td>${n}</td><td>${k}</td><td>${m}</td><td>${u.pdi.filter(x=>!x.ok).map(x=>E(x.c)).join(', ')||'–'}</td></tr>`}).join('');
return`<h1>Painel administrativo</h1><div class="stats"><div class="card"><strong>${L.length}</strong>Funcionários</div><div class="card"><strong>${a}</strong>Treinamentos atribuídos</div><div class="card"><strong>${d}</strong>Cursos concluídos</div><div class="card"><strong>${a?Math.round(d/a*100):0}%</strong>Taxa de conclusão</div></div>
<section><h2>Acompanhamento por colaborador</h2><div class="tw"><table><tr><th>Colaborador</th><th>Atribuídos</th><th>Concluídos</th><th>Média nas avaliações</th><th>Necessidades de capacitação</th></tr>${rows||'<tr><td colspan=5>Cadastre funcionários em Equipe.</td></tr>'}</table></div></section>
<section><h2>Criar curso da empresa</h2><form class="f" onsubmit="addC(event)"><label>Título<input name="t" required></label><label>Área<select name="a"><option>Geral</option>${DEPS.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Carga horária (h)<input type="number" name="h" min="1" value="2" required></label><label>Descrição<input name="d" required></label><label>Módulos (um por linha)<textarea name="m" rows="4" required placeholder="Título|Texto do material|Pergunta|Opção A;Opção B;Opção C|2"></textarea></label><p class="mut">Formato: título|texto|pergunta|opções separadas por ponto e vírgula|número da opção correta.</p><button class="btn">Publicar curso</button></form></section>`}
function team(){const L=team_(),cs=myC();return`<h1>Equipe e trilhas</h1><form class="f" onsubmit="addU(event)"><h3>Novo funcionário</h3><label>Nome<input name="name" required></label><label>E-mail<input type="email" name="email" required></label><label>Senha inicial<input name="pass" required minlength="4"></label><label>Cargo<input name="cargo" required></label><label>Departamento<select name="depto">${DEPS.map(x=>`<option>${x}</option>`).join('')}</select></label><button class="btn">Cadastrar</button></form>
<section><h2>Funcionários (${L.length})</h2><div class="grid">${L.map(u=>`<div class="card"><h3>${E(u.name)}</h3><span class="tag">${E(u.depto)}</span> <span class="mut">${E(u.cargo)}</span><p><b>Cursos:</b></p>${cs.map(c=>`<label style="font-weight:400;margin:2px 0"><input type="checkbox" style="width:auto" ${u.assign.includes(c.id)?'checked':''} onchange="as('${u.id}','${c.id}')"> ${E(c.t)}</label>`).join('')}<p><button class="btn s g" onclick="trail('${u.id}')">Atribuir trilha do departamento</button></p><p><b>PDI:</b> ${u.pdi.map(x=>E(x.c)+(x.ok?' ✓':'')).join('; ')||'–'}</p><form onsubmit="addP(event,'${u.id}')"><input name="c" placeholder="Competência a aprimorar" required> <button class="btn s">Adicionar</button></form><p><button class="btn s g" onclick="del('${u.id}')">Remover</button></p></div>`).join('')||'<p>Nenhum funcionário ainda.</p>'}</div></section>`}

/* ===== AÇÕES ===== */
function doReg(e){const f=fd(e);if(!cnpjOk(f.cnpj))return T('CNPJ inválido. Confira os 14 dígitos.');if(f.porte=='MG')return T('A plataforma atende apenas micro e pequenas empresas (MEI, ME ou EPP).');if(S.users.some(u=>u.email==f.email))return T('Este e-mail já está cadastrado.');const c={id:id(),cnpj:f.cnpj,name:f.name,porte:f.porte,owner:f.owner,custom:[]},u={id:id(),co:c.id,name:f.owner,email:f.email,pass:f.pass,role:'admin',cargo:'Proprietário',depto:'Geral',pdi:[],assign:[]};S.cos.push(c);S.users.push(u);S.me=u.id;save();T('Empresa cadastrada. Agora cadastre seus funcionários.');to('equipe')}
function doLogin(e){const f=fd(e),u=S.users.find(x=>x.email==f.email&&x.pass==f.pass);if(!u)return T('E-mail ou senha incorretos.');S.me=u.id;save();to(u.role=='admin'?'painel':'perfil')}
const demo=()=>{S.me='u1';save();to('painel')},out=()=>{S.me=null;save();to('')};
function sub(e,c,k){e.preventDefault();const f=new FormData(e.target),qs=course(c).m[k][2],ok=qs.filter((q,n)=>+f.get('q'+n)===q[2]).length,s=Math.round(ok/qs.length*100),p=prog(S.me,c);p.sc[k]=Math.max(p.sc[k]??0,s);if(s<MIN)T(`Nota ${s}%. O mínimo é ${MIN}%. Revise o material e tente de novo.`);else if(pct(S.me,c)==100&&!p.cert){p.cert=new Date().toISOString();T('Curso concluído! Seu certificado foi emitido.')}else T(`Módulo aprovado com ${s}%.`);save();go()}
function saveP(e){const f=fd(e),u=me();u.name=f.name;u.cargo=f.cargo;if(f.pass)u.pass=f.pass;save();T('Perfil atualizado.');go()}
function addP(e,i){const f=fd(e);S.users.find(u=>u.id==i).pdi.push({c:f.c,ok:0});save();go()}
function tg(i,k){const x=S.users.find(u=>u.id==i).pdi[k];x.ok=x.ok?0:1;save();go()}
function as(i,c){const u=S.users.find(x=>x.id==i),a=u.assign,k=a.indexOf(c);k<0?a.push(c):a.splice(k,1);save()}
function trail(i){const u=S.users.find(x=>x.id==i);myC().filter(c=>c.a=='Geral'||c.a==u.depto).forEach(c=>u.assign.includes(c.id)||u.assign.push(c.id));save();T('Trilha atribuída.');go()}
function addU(e){const f=fd(e);if(S.users.some(u=>u.email==f.email))return T('Este e-mail já está cadastrado.');S.users.push({id:id(),co:me().co,role:'func',pdi:[],assign:[],...f});save();T('Funcionário cadastrado.');go()}
function del(i){if(confirm('Remover este funcionário?')){S.users=S.users.filter(u=>u.id!=i);save();go()}}
function addC(e){const f=fd(e);try{const m=f.m.split('\n').filter(l=>l.trim()).map(l=>{const p=l.split('|');if(p.length<5)throw 0;const o=p[3].split(';').map(s=>s.trim());return[p[0].trim(),p[1].trim(),[[p[2].trim(),o,+p[4]-1]]]});co().custom.push({id:'x'+id(),t:f.t,a:f.a,h:+f.h,d:f.d,m});save();T('Curso publicado.');to('cursos')}catch(x){T('Formato dos módulos inválido. Veja o exemplo no campo.')}}

/* ===== ROTEADOR ===== */
function nav(){const u=me();$('#nav').innerHTML=`<a href="#inicio">Início</a><a href="#sobre">Sobre nós</a><a href="#cursos">Cursos</a>`+(u?(u.role=='admin'?'<a href="#painel">Painel</a><a href="#equipe">Equipe</a>':'')+`<a href="#perfil">Perfil (${E(u.name.split(' ')[0])})</a><a href="#" onclick="out();return false">Sair</a>`:'<a href="#entrar">Entrar</a><a href="#cadastro">Cadastrar empresa</a>')}
function go(){const[p,a]=location.hash.slice(1).split('/'),u=me(),R={'':home,inicio:home,sobre:about,cadastro:reg,entrar:login,cursos:cat,perfil:prof,painel:panel,equipe:team,curso:()=>player(a),certificado:()=>cert(a)};nav();if(!R[p])return $('#app').innerHTML='<p>Página não encontrada.</p>';if(['perfil','painel','equipe','curso','certificado'].includes(p)&&!u)return to('entrar');if(['painel','equipe'].includes(p)&&u.role!='admin')return to('perfil');$('#app').innerHTML=R[p]();scrollTo(0,0)}
addEventListener('hashchange',go);go();
</script>
